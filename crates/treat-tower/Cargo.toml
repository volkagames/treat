[package]
authors.workspace = true
categories.workspace = true
description = "tower middleware for treat on axum and other tower stacks: request id, root span, OpenTelemetry"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "treat-tower"
repository.workspace = true
resolver = "3"
rust-version.workspace = true
version.workspace = true

[features]
telemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
http = "1"
opentelemetry = { version = "0.33", optional = true }
pin-project = "1"
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1", features = ["log"] }
tracing-opentelemetry = { version = "0.34", optional = true }
# Only for the type-erased `ApiErrorHandler` treat's axum adapter stores in the
# response extensions, recorded as `exception.*` on the root span.
treat-core = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
# `registry` for the subscriber the OpenTelemetry test layers stack on.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
