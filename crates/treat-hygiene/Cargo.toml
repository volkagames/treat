[package]
name = "treat-hygiene"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

# Compile-only regression crate for derive-macro path hygiene (F5). It depends on
# `treat` WITHOUT a direct `erris` dependency and WITHOUT importing the prelude,
# so any bare `ApiResponse`/`erris` in generated code fails to compile here.

[dependencies]
treat = { path = "../treat", features = ["derive"] }

# A core-only dependant: `treat-core` + `treat-derive` with no facade in scope.
treat-core = { path = "../treat-core" }
treat-derive = { path = "../treat-derive" }
thiserror = "2"

[lints]
workspace = true
