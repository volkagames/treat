[package]
authors.workspace = true
categories.workspace = true
description = "Typed API error codes in the response body, for JSON-over-HTTP services on actix, axum, and poem"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "treat"
readme = "../../README.md"
repository.workspace = true
resolver = "3"
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
actix = ["treat-core/actix", "actix-middleware", "actix-telemetry"]
actix-middleware = ["dep:treat-actix"]
actix-telemetry = ["actix-middleware", "treat-actix/telemetry"]
axum = ["treat-core/axum"]
backtrace = ["treat-core/backtrace"]
default = ["derive"]
derive = ["dep:treat-derive"]
error-status-500 = ["treat-core/error-status-500"]
meta-slots = ["treat-core/meta-slots"]
nightly-provide = ["treat-core/nightly-provide"]
openapi = ["treat-core/openapi"]
poem = ["treat-core/poem"]
rpc-status-header = ["treat-core/rpc-status-header"]
serde-path = ["treat-core/serde-path"]
spantrace = ["treat-core/spantrace"]
tower-middleware = ["dep:treat-tower"]
tower-telemetry = ["tower-middleware", "treat-tower/telemetry"]
validator = ["treat-core/validator"]
validator-extract = ["treat-core/validator-extract"]
verbose-error = ["treat-core/verbose-error"]

[dependencies]
treat-actix = { workspace = true, optional = true }
treat-core = { workspace = true }
treat-derive = { workspace = true, optional = true }
treat-tower = { workspace = true, optional = true }

[dev-dependencies]
actix-web = "4.11"
axum = "0.8"
criterion = "0.8"
erris = { workspace = true }
log = "0.4.33"
poem = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = { version = "0.1", features = [
	"std",
	"attributes",
	"tracing-attributes",
	"log",
	"async-await",
	"max_level_debug",
	"release_max_level_info",
	"valuable",
] }
tracing-subscriber = { version = "0.3.23", features = [
	"json",
	"registry",
	"env-filter",
] }
triomphe = "0.1.16"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
validator = { version = "0.20", features = ["derive"] }

[[bench]]
name = "bench_box_vs_arc"
harness = false

[[bench]]
name = "bench_error_response"
harness = false

[lints]
workspace = true
