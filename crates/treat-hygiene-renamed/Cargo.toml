[package]
name = "treat-hygiene-renamed"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

# Compile-only regression crate: the facade is depended on under a DIFFERENT name
# (`envelope`), so generated code that hardcodes `treat::` fails to compile here.
# Lives apart from `treat-hygiene` because cargo forbids depending on one path
# crate under two names.

[dependencies]
envelope = { package = "treat", path = "../treat", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
